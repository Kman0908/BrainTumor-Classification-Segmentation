services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: brain-tumor-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: brain-tumor-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend